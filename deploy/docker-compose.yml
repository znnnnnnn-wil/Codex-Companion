services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codex_companion
      POSTGRES_USER: codex_companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - codex-companion-postgres:/var/lib/postgresql/data
      - ../services/relay/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_companion -d codex_companion"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend

  relay:
    build:
      context: ..
      dockerfile: services/relay/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      RELAY_ADDR: :8080
      DATABASE_URL: postgres://codex_companion:${POSTGRES_PASSWORD}@postgres:5432/codex_companion?sslmode=disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - backend

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - backend

volumes:
  codex-companion-postgres:

networks:
  backend:
    driver: bridge
