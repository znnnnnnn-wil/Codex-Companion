name: Release Bridge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Bridge
        shell: pwsh
        run: ./scripts/publish-bridge.ps1 -Runtime win-x64 -Version '${{ github.ref_name }}'
      - name: Validate Windows PowerShell 5.1 compatibility
        shell: powershell
        run: ./scripts/test-bridge-package.ps1 -PackageDirectory '.artifacts/bridge-win-x64-${{ github.ref_name }}'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build GUI installer
        shell: pwsh
        run: |
          $payload = (Resolve-Path '.artifacts/bridge-win-x64-${{ github.ref_name }}').Path
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '/DVersion=${{ github.ref_name }}' "/DPayloadDir=$payload" 'installer/CodexCompanionBridge.iss'
      - name: Upload Bridge package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .artifacts/CodexCompanion-Bridge-win-x64-${{ github.ref_name }}.zip
            .artifacts/CodexCompanion-Bridge-win-x64-${{ github.ref_name }}.zip.sha256
            .artifacts/CodexCompanion-Bridge-Setup-win-x64-${{ github.ref_name }}.exe

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/relay/Dockerfile
          push: true
          tags: |
            ghcr.io/znnnnnnn-wil/codex-companion-relay:${{ github.ref_name }}
            ghcr.io/znnnnnnn-wil/codex-companion-relay:latest
      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/znnnnnnn-wil/codex-companion-web:${{ github.ref_name }}
            ghcr.io/znnnnnnn-wil/codex-companion-web:latest
